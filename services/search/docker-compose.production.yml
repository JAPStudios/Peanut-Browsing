# Production topology: authenticated Nginx gateway -> private SearXNG -> Valkey.
# Put a TLS reverse proxy in front of the loopback-only gateway port.
name: peanut-browsing-search

services:
  core:
    container_name: peanut-browsing-search
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      - ./core-config/:/etc/searxng/:Z
      - search-cache:/var/cache/searxng/
    depends_on:
      - valkey
    networks:
      - search-backend

  index:
    container_name: peanut-browsing-first-party-index
    build:
      context: ../index
    restart: unless-stopped
    environment:
      INDEX_DB_PATH: /data/index.sqlite
      PEANUT_SEARCH_API_KEY: ${PEANUT_SEARCH_API_KEY:?Set PEANUT_SEARCH_API_KEY in .env}
    volumes:
      - index-data:/data/
    networks:
      - search-backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  valkey:
    container_name: peanut-browsing-search-cache
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 300 1 --save 60 1000 --loglevel warning
    restart: unless-stopped
    volumes:
      - valkey-cache:/data/
    networks:
      - search-backend

  gateway:
    container_name: peanut-browsing-search-gateway
    image: docker.io/library/nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PEANUT_SEARCH_GATEWAY_PORT:-8081}:8080"
    environment:
      PEANUT_SEARCH_API_KEY: ${PEANUT_SEARCH_API_KEY:?Set PEANUT_SEARCH_API_KEY in .env}
      NGINX_ENVSUBST_FILTER: "^PEANUT_SEARCH_API_KEY$"
    volumes:
      - ./gateway/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - core
      - index
    networks:
      - search-backend

networks:
  search-backend:
    driver: bridge

volumes:
  search-cache:
  valkey-cache:
  index-data:
