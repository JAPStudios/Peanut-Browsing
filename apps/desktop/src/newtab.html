<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; form-action peanut-search:;">
  <title>New Tab — Peanut Browsing</title>
  <style>
    :root { color-scheme: light; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #20242b; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff; }
    main { width: min(680px, calc(100% - 40px)); text-align: center; margin-top: -7vh; }
    h1 { margin: 0 0 12px; font-size: clamp(34px, 6vw, 54px); letter-spacing: -2px; font-weight: 650; }
    .tagline { margin: 0 0 28px; color: #737c89; font-size: 14px; line-height: 1.7; }
    form { display: flex; gap: 9px; width: 100%; }
    input { flex: 1; min-width: 0; height: 50px; padding: 0 18px; border: 1px solid #cbd1da; border-radius: 26px; background: #fff; color: #20242b; font: inherit; font-size: 15px; }
    button { height: 50px; padding: 0 24px; border: 1px solid #20242b; border-radius: 26px; background: #20242b; color: #fff; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
    button:hover { opacity: .88; }
    input:focus-visible, button:focus-visible { outline: 2px solid #657b9a; outline-offset: 3px; }
    .hint { margin-top: 22px; font-size: 12px; color: #9299a3; }
    @media (max-width: 420px) { main { width: calc(100% - 28px); } form { gap: 7px; } button { padding: 0 17px; } }
  </style>
</head>
<body>
  <main>
    <h1>Peanut Browsing</h1>
    <p class="tagline">Search the web or enter a website address in the browser bar above.</p>
    <form action="peanut-search://results/" method="get" role="search">
      <label for="query" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">Search the web</label>
      <input id="query" name="q" type="search" maxlength="200" placeholder="Search the web" autocomplete="off" required>
      <button type="submit">Search</button>
    </form>
    <p class="hint">Search results come from Peanut Browsing’s first-party index.</p>
  </main>
</body>
</html>
