<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline';">
  <title>New Tab — Peanut Browsing</title>
  <style>
    :root { color-scheme: light; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #20242b; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff; }
    main { width: min(620px, calc(100% - 40px)); text-align: center; margin-top: -7vh; }
    h1 { margin: 0 0 12px; font-size: clamp(34px, 6vw, 54px); letter-spacing: -2px; font-weight: 650; }
    p { margin: 0; color: #737c89; font-size: 14px; line-height: 1.7; }
    .hint { margin-top: 26px; font-size: 12px; color: #9299a3; }
  </style>
</head>
<body>
  <main>
    <h1>Peanut Browsing</h1>
    <p>Search the web or enter a website address in the bar above.</p>
    <p class="hint">Search is provided by Peanut Browsing's own search service.</p>
  </main>
</body>
</html>
