name: Peanut Browsing desktop syntax

on:
  push:
    paths:
      - "apps/desktop/**"
      - "services/search/**"
      - "render.yaml"
      - "services/index/**"
      - "src/backend/**"
      - ".github/workflows/peanut-desktop-syntax.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "services/search/**"
      - "render.yaml"
      - "services/index/**"
      - "src/backend/**"
      - ".github/workflows/peanut-desktop-syntax.yml"

concurrency:
  group: peanut-desktop-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check first-party index Python syntax
        run: python -m py_compile services/index/server.py
      - name: Test first-party search index
        working-directory: services/index
        run: python -m unittest -v
      - name: Check Wix search helper syntax
        run: node --experimental-default-type=module --check src/backend/searchUtils.js
      - name: Test Wix search helper
        run: node --experimental-default-type=module --test src/backend/searchUtils.test.js
      - name: Check Wix website import helper syntax
        run: node --experimental-default-type=module --check src/backend/siteImportUtils.js
      - name: Test Wix website import helpers
        run: node --experimental-default-type=module --test src/backend/siteImportUtils.test.js
      - name: Check Wix search web module syntax
        run: node --input-type=module --check < src/backend/webSearch.jsw
      - name: Check Wix website indexing module syntax
        run: node --input-type=module --check < src/backend/indexedWebsites.jsw
      - name: Check Wix HTTP search endpoint syntax
        run: node --check src/backend/http-functions.js
      - name: Check Wix page code syntax
        run: find src/pages -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check Electron main process
        run: node --check apps/desktop/src/main.cjs
      - name: Check website importer
        run: node --check apps/desktop/src/importer.cjs
      - name: Check imported-site library
        run: node --check apps/desktop/src/import-library.cjs
      - name: Check browser profile store
        run: node --check apps/desktop/src/profile-store.cjs
      - name: Check first-party search result normalizer
        run: node --check apps/desktop/src/search-page.cjs
      - name: Check search results interface
        run: node --check apps/desktop/src/search.js
      - name: Check sitemap utilities
        run: node --check apps/desktop/src/sitemap-utils.cjs
      - name: Check CSS asset discovery
        run: node --check apps/desktop/src/asset-references.cjs
      - name: Check page version merger
        run: node --check apps/desktop/src/page-record.cjs
      - name: Check library interface
        run: node --check apps/desktop/src/library.js
      - name: Resolve desktop dependencies
        working-directory: apps/desktop
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Test imported-site library
        run: node --test apps/desktop/test/*.test.cjs
      - name: Check preload bridge
        run: node --check apps/desktop/src/preload.cjs
      - name: Check renderer
        run: node --check apps/desktop/src/renderer/app.js
      - name: Verify ad and tracker filter exports
        working-directory: apps/desktop
        run: node -e "const m = require('@ghostery/adblocker-electron'); if (typeof m.ElectronBlocker.fromLists !== 'function' || !Array.isArray(m.adsAndTrackingLists) || m.adsAndTrackingLists.length === 0) process.exit(1)"
      - name: Configure Electron sandbox for CI
        working-directory: apps/desktop
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Verify Electron package
        working-directory: apps/desktop
        run: node -p "require('electron/package.json').version"
      - name: Smoke-test desktop and tracker-filter initialization
        working-directory: apps/desktop
        run: |
          set +e
          PEANUT_CI_TEST=1 xvfb-run -a timeout 120s npx electron .
          status=$?
          if [ "$status" -eq 124 ]; then exit 1; fi
          exit "$status"
      - name: Validate first-party production Compose configuration
        env:
          PEANUT_SEARCH_API_KEY: ci-placeholder-key
        run: docker compose -f services/search/docker-compose.production.yml config --quiet
      - name: Build first-party index container
        run: docker build -t peanut-browsing-index:ci services/index
      - name: Install Render blueprint validation dependency
        run: python -m pip install PyYAML
      - name: Validate Render deployment blueprint
        run: python services/search/test_render_blueprint.py
      - name: Build Render search gateway container
        run: docker build -f services/search/gateway/Dockerfile -t peanut-browsing-render-gateway:ci services/search/gateway
      - name: Smoke-test Render search gateway
        env:
          PEANUT_SEARCH_API_KEY: ci-placeholder-key
          PEANUT_INDEX_HOST: index:8081
          NGINX_ENVSUBST_FILTER: PEANUT_SEARCH_API_KEY|PEANUT_INDEX_HOST
        run: |
          set -eu
          container="peanut-render-gateway-ci"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name "$container" -p 18082:10000 -e "PEANUT_SEARCH_API_KEY=$PEANUT_SEARCH_API_KEY" -e "PEANUT_INDEX_HOST=$PEANUT_INDEX_HOST" -e "NGINX_ENVSUBST_FILTER=$NGINX_ENVSUBST_FILTER" peanut-browsing-render-gateway:ci
          ready=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18082/healthz >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          unauthorized=$(curl --silent --output /dev/null --write-out "%{http_code}" "http://127.0.0.1:18082/index/search?q=peanut")
          test "$unauthorized" = "401"
      - name: Validate Nginx first-party search gateway
        env:
          PEANUT_SEARCH_API_KEY: ci-placeholder-key
        run: |
          docker run --rm --add-host index:127.0.0.1 --entrypoint /bin/sh \
            -e PEANUT_SEARCH_API_KEY="$PEANUT_SEARCH_API_KEY" \
            -v "$PWD/services/search/gateway/default.conf.template:/tmp/default.conf.template:ro" \
            nginx:1.29-alpine -c "apk add --no-cache gettext >/dev/null && envsubst '\$PEANUT_SEARCH_API_KEY' < /tmp/default.conf.template > /etc/nginx/conf.d/default.conf && nginx -t"
      - name: Exercise first-party search gateway end to end
        env:
          PEANUT_SEARCH_API_KEY: ci-placeholder-key
          PEANUT_SEARCH_GATEWAY_PORT: "18081"
        run: |
          set -eu
          project="peanut-ci-$GITHUB_RUN_ID"
          compose="docker compose -p $project -f services/search/docker-compose.production.yml"
          cleanup() {
            $compose down --volumes --remove-orphans
          }
          trap cleanup EXIT
          $compose up -d --build
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18081/healthz >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          unauthorized=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            "http://127.0.0.1:18081/index/search?q=peanut")
          test "$unauthorized" = "401"
          $compose exec -T index python -c "from server import IndexStore; store = IndexStore('/data/index.sqlite'); store.upsert('https://peanut.example/', 'Peanut Browsing', 'First-party privacy search test record')"
          curl --fail --silent --show-error \
            -H "X-API-Key: $PEANUT_SEARCH_API_KEY" \
            "http://127.0.0.1:18081/index/search?q=privacy" \
            | python -c "import json,sys; payload=json.load(sys.stdin); assert payload['status']=='ok'; assert payload['totalResults']==1; assert payload['results'][0]['url']=='https://peanut.example/'; print('Authenticated first-party search returned the seeded result.')"
